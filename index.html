<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TravelMate</title>
  <meta name="description" content="Offline-first personal organizer for a Work and Travel trip to Australia." />

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1f5d38" />

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TravelMate" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />

<body>
  <div id="offline-indicator" hidden>Offline — changes are saved on this device and nothing is lost.</div>

  <header class="app-header">
    <span class="app-header__logo-plate">
      <img class="app-header__logo" src="icons/logo-header.png" alt="TravelMate" />
    </span>
  </header>

  <main id="view" class="view"></main>

  <nav id="nav" class="bottom-nav"></nav>

  <script type="module" src="js/app.js"></script>

</html>
